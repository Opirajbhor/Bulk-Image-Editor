<!DOCTYPE html>
<html lang="en" class="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReadyChobi</title>
<link rel="manifest" id="pwaManifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-weight='bold' font-family='sans-serif'>R</text></svg>">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.2/dist/jszip.min.js"></script>

<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: { brand: { DEFAULT: '#2563eb', hover: '#1d4ed8', soft: '#eff6ff' } },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        boxShadow: {
          'soft': '0 1px 2px rgba(0,0,0,0.05), 0 4px 6px -1px rgba(0,0,0,0.02)',
          'lift': '0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05)',
        }
      },
    },
  };
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  body { font-family: 'Inter', sans-serif; }
  
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  .dark ::-webkit-scrollbar-thumb { background: #475569; }

  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .skeleton {
    background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite linear;
  }
  .dark .skeleton {
    background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
    background-size: 200% 100%;
  }

  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(37, 99, 235, 0.3); }
    50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.5); }
  }
  .processing-glow { animation: glowPulse 2s ease-in-out infinite; }

  @keyframes orbit {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .orbit-ring { animation: orbit 1.5s linear infinite; }
  .orbit-ring-slow { animation: orbit 3s linear infinite reverse; }

  input[type="color"] { -webkit-appearance: none; border: none; padding: 0; background: none; cursor: pointer; }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }

  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .toast { animation: slideIn 0.3s ease-out forwards; }

  input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px; background: rgba(148,163,184,.3); border-radius: 4px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%; background: #2563eb;
    margin-top: -5px; box-shadow: 0 1px 3px rgba(0,0,0,.2); border: 2px solid white;
  }
  .dark input[type="range"]::-webkit-slider-thumb { border-color: #0f172a; }

  .checker-soft { background-image: repeating-conic-gradient(#eef2f7 0 25%, #f8fafc 0 50%); background-size: 16px 16px; }
  .dark .checker-soft { background-image: repeating-conic-gradient(#1e293b 0 25%, #0f172a 0 50%); }
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 h-screen overflow-hidden flex flex-col antialiased selection:bg-brand/20">

<!-- HEADER -->
<header class="h-14 shrink-0 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-5 z-20 relative">
  <div class="flex items-center gap-3">
    <img src="https://img.icons8.com/3d-fluency/94/stack-of-photos.png" alt="ReadyChobi" class="w-8 h-8 object-contain" onerror="this.outerHTML='&lt;div class=\'w-8 h-8 rounded-lg bg-gradient-to-br from-brand to-violet-600 flex items-center justify-center text-white font-bold text-sm\'&gt;R&lt;/div&gt;'">
    <h1 class="font-semibold text-sm tracking-tight text-slate-900 dark:text-white">ReadyChobi</h1>
    <div class="h-4 w-px bg-slate-200 dark:bg-slate-700 mx-1"></div>
    <div class="flex items-center gap-1.5 px-2 py-1 rounded-full bg-slate-100 dark:bg-slate-800">
      <div id="aiDot" class="w-2 h-2 rounded-full bg-slate-400"></div>
      <span id="aiText" class="text-[10px] font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Idle</span>
    </div>
  </div>
  <div class="flex items-center gap-1">
    <button id="undoBtn" disabled class="w-8 h-8 flex items-center justify-center rounded-md text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-30 disabled:hover:bg-transparent transition-colors" title="Undo (Ctrl+Z)"><i class="ph ph-arrow-u-up-left text-lg"></i></button>
    <button id="redoBtn" disabled class="w-8 h-8 flex items-center justify-center rounded-md text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-30 disabled:hover:bg-transparent transition-colors" title="Redo (Ctrl+Shift+Z)"><i class="ph ph-arrow-u-up-right text-lg"></i></button>
    <div class="h-4 w-px bg-slate-200 dark:bg-slate-700 mx-1"></div>
    <button id="langToggle" class="w-8 h-8 flex items-center justify-center rounded-md text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors font-bold text-xs" title="Language">বাং</button>
    <button id="themeToggle" class="w-8 h-8 flex items-center justify-center rounded-md text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="Toggle Theme">
      <i class="ph ph-moon text-lg hidden dark:block"></i>
      <i class="ph ph-sun text-lg block dark:hidden"></i>
    </button>
    <a href="https://github.com/Opirajbhor" target="_blank" class="flex items-center gap-2 pl-1 pr-3 h-8 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors ml-1">
      <img src="https://github.com/Opirajbhor.png?size=64" alt="Opirajbhor" class="w-6 h-6 rounded-full ring-1 ring-white/50 dark:ring-slate-900/50" onerror="this.style.display='none'">
      <span class="text-xs font-semibold text-slate-700 dark:text-slate-200 hidden md:inline">Opirajbhor</span>
    </a>
  </div>
</header>

<!-- MAIN -->
<div class="flex-1 flex overflow-hidden">
  <main class="flex-1 overflow-y-auto p-6 lg:p-8 flex flex-col">
    <div id="dropZone" class="flex-1 min-h-[300px] border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl flex flex-col items-center justify-center text-center cursor-pointer transition-all hover:border-brand hover:bg-brand/5 dark:hover:bg-slate-900/50 mb-6 group">
      <div class="w-16 h-16 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 group-hover:text-brand group-hover:scale-105 transition-all mb-4">
        <i class="ph ph-upload-simple text-3xl"></i>
      </div>
      <h2 class="text-lg font-semibold text-slate-700 dark:text-slate-200 mb-1">Drop your photos here</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">or click to browse files</p>
      <div class="flex gap-3 text-xs font-medium text-slate-400">
        <span class="bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded">PNG</span>
        <span class="bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded">JPG</span>
        <span class="bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded">WebP</span>
      </div>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple class="hidden">

    <div id="libraryHeader" class="hidden items-center justify-between mb-4">
      <div class="flex items-center gap-2">
        <h2 class="text-sm font-semibold text-slate-700 dark:text-slate-300">Library</h2>
        <span id="libCount" class="text-xs font-medium bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 px-2 py-0.5 rounded-full">0</span>
      </div>
      <button id="clearBtn" class="text-xs font-medium text-slate-500 hover:text-red-500 transition-colors">Clear all</button>
    </div>

    <div id="library" class="grid grid-cols-[repeat(auto-fill,minmax(180px,1fr))] gap-4"></div>
  </main>

  <aside class="w-[340px] shrink-0 bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 flex flex-col hidden lg:flex">
    <div class="flex-1 overflow-y-auto p-5 space-y-6">
      <div>
        <label class="block text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">Preset</label>
        <div class="relative">
          <select id="cropPreset" class="w-full appearance-none bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-sm rounded-lg pl-3 pr-8 py-2 focus:outline-none focus:ring-2 focus:ring-brand/20 focus:border-brand transition-all">
            <option value="bd-passport" selected>Bangladesh Passport — 40×50 mm</option>
            <option value="bd-visa">Bangladesh Visa — 35×45 mm</option>
            <option value="us-passport">US Passport — 2×2 in</option>
            <option value="schengen-visa">Schengen/Visa — 35×45 mm</option>
            <option value="india-passport">India Passport — 35×35 mm</option>
            <option value="china-visa">China Visa — 33×48 mm</option>
            <option value="square">Square — 1:1</option>
            <option value="none">No crop (original)</option>
            <option value="custom">Custom…</option>
          </select>
          <i class="ph ph-caret-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
        </div>
        <div id="customCropGroup" class="hidden mt-2 grid grid-cols-2 gap-2">
          <input type="number" id="customCropW" placeholder="W" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand">
          <input type="number" id="customCropH" placeholder="H" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand">
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">Framing</label>
        <div class="space-y-2">
          <label class="flex items-center gap-3 p-2 -mx-2 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800/50 cursor-pointer transition-colors">
            <input type="checkbox" id="autoFocus" checked class="w-4 h-4 rounded border-slate-300 text-brand focus:ring-brand cursor-pointer">
            <span class="text-sm text-slate-700 dark:text-slate-300 flex-1">Auto-focus face</span>
          </label>
          <label class="flex items-center gap-3 p-2 -mx-2 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800/50 cursor-pointer transition-colors">
            <input type="checkbox" id="autoEnhance" class="w-4 h-4 rounded border-slate-300 text-brand focus:ring-brand cursor-pointer">
            <span class="text-sm text-slate-700 dark:text-slate-300 flex-1">Auto-enhance</span>
          </label>
          <label class="flex items-center gap-3 p-2 -mx-2 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800/50 cursor-pointer transition-colors">
            <input type="checkbox" id="trimEdges" checked class="w-4 h-4 rounded border-slate-300 text-brand focus:ring-brand cursor-pointer">
            <span class="text-sm text-slate-700 dark:text-slate-300 flex-1">Trim empty edges</span>
          </label>
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="block text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Background</label>
          <select id="bgMode" class="text-[10px] font-semibold bg-slate-100 dark:bg-slate-800 border-none rounded text-slate-600 dark:text-slate-300 py-0.5 px-1 focus:ring-0 cursor-pointer">
            <option value="solid">Solid</option>
            <option value="gradient">Gradient</option>
          </select>
        </div>
        
        <div id="solidBgControls">
          <div class="flex items-center gap-2 mb-3">
            <div class="relative w-9 h-9 rounded-lg overflow-hidden border border-slate-200 dark:border-slate-700 cursor-pointer shadow-sm shrink-0" style="background:#ACC0FB">
              <input type="color" id="bgColor" value="#ACC0FB" class="absolute -inset-2 w-[calc(100%+16px)] h-[calc(100%+16px)]">
            </div>
            <input type="text" id="colorHex" value="#ACC0FB" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-1.5 text-xs font-mono uppercase focus:outline-none focus:border-brand">
          </div>
          <div class="flex flex-wrap gap-1.5" id="swatches">
            <button class="w-6 h-6 rounded border border-slate-200 shadow-sm transition-transform hover:scale-110" style="background:#ACC0FB" data-color="#ACC0FB"></button>
            <button class="w-6 h-6 rounded border border-slate-200 shadow-sm transition-transform hover:scale-110" style="background:#ffffff" data-color="#ffffff"></button>
            <button class="w-6 h-6 rounded border border-slate-200 shadow-sm transition-transform hover:scale-110" style="background:#2563eb" data-color="#2563eb"></button>
            <button class="w-6 h-6 rounded border border-slate-200 shadow-sm transition-transform hover:scale-110" style="background:#dc2626" data-color="#dc2626"></button>
            <button class="w-6 h-6 rounded border border-slate-200 shadow-sm transition-transform hover:scale-110" style="background:#16a34a" data-color="#16a34a"></button>
            <button class="w-6 h-6 rounded border border-slate-200 shadow-sm transition-transform hover:scale-110" style="background:#f59e0b" data-color="#f59e0b"></button>
            <button class="w-6 h-6 rounded border border-slate-200 shadow-sm transition-transform hover:scale-110" style="background:#000000" data-color="#000000"></button>
            <button class="w-6 h-6 rounded border border-dashed border-slate-400 shadow-sm transition-transform hover:scale-110 flex items-center justify-center bg-white text-slate-400" data-color="transparent"><i class="ph ph-drop-half text-xs"></i></button>
          </div>
        </div>

        <div id="gradientBgControls" class="hidden">
          <div class="flex items-center gap-2 mb-2">
            <div class="flex-1">
              <label class="text-[10px] text-slate-500 mb-1 block">Color 1</label>
              <div class="relative w-full h-8 rounded overflow-hidden border border-slate-200 dark:border-slate-700 cursor-pointer" style="background:#ACC0FB">
                <input type="color" id="gradColor1" value="#ACC0FB" class="absolute -inset-2 w-[calc(100%+16px)] h-[calc(100%+16px)]">
              </div>
            </div>
            <div class="flex-1">
              <label class="text-[10px] text-slate-500 mb-1 block">Color 2</label>
              <div class="relative w-full h-8 rounded overflow-hidden border border-slate-200 dark:border-slate-700 cursor-pointer" style="background:#ffffff">
                <input type="color" id="gradColor2" value="#ffffff" class="absolute -inset-2 w-[calc(100%+16px)] h-[calc(100%+16px)]">
              </div>
            </div>
          </div>
          <div>
            <label class="text-[10px] text-slate-500 mb-1 block">Angle</label>
            <input type="range" id="gradAngle" min="0" max="360" value="180" class="w-full">
          </div>
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">Output</label>
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-sm text-slate-600 dark:text-slate-400">Format</span>
            <select id="outputFormat" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 text-xs focus:outline-none">
              <option value="image/webp">WebP</option>
              <option value="image/jpeg">JPEG</option>
              <option value="image/png">PNG</option>
            </select>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-sm text-slate-600 dark:text-slate-400">Size</span>
            <div class="flex items-center gap-1">
              <input type="number" id="sizeMin" value="20" class="w-12 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded px-1.5 py-1 text-xs text-center focus:outline-none">
              <span class="text-slate-400 text-xs">-</span>
              <input type="number" id="sizeMax" value="50" class="w-12 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded px-1.5 py-1 text-xs text-center focus:outline-none">
              <span class="text-xs text-slate-400 font-medium">KB</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="p-4 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 space-y-2 shrink-0">
      <button id="processBtn" disabled class="w-full flex items-center justify-center gap-2 bg-brand hover:bg-brand-hover text-white font-medium text-sm py-2.5 rounded-lg shadow-sm transition-all disabled:opacity-50 disabled:cursor-not-allowed">
        <i class="ph ph-play-circle text-lg"></i>
        <span id="processBtnText">Process All</span>
      </button>
      <button id="downloadZipBtn" disabled class="w-full flex items-center justify-center gap-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium text-sm py-2.5 rounded-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed">
        <i class="ph ph-archive-box text-lg"></i>
        <span>Download ZIP</span>
      </button>
    </div>
  </aside>
</div>

<!-- EDIT MODAL -->
<div id="editModal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-sm hidden flex-col">
  <div class="h-14 shrink-0 flex items-center justify-between px-4 text-white border-b border-white/10">
    <div class="flex items-center gap-3">
      <button id="editModalClose" class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-white/10 transition-colors"><i class="ph ph-x text-xl"></i></button>
      <span class="text-sm font-medium">Edit Photo</span>
    </div>
    <div class="flex items-center gap-1 bg-white/5 rounded-lg p-0.5">
      <button id="tabCrop" class="tab-btn px-4 py-1.5 rounded-md text-xs font-semibold transition-all bg-white/10 text-white">Crop</button>
      <button id="tabFilters" class="tab-btn px-4 py-1.5 rounded-md text-xs font-semibold transition-all text-white/60 hover:text-white">Filters</button>
    </div>
    <div class="flex items-center gap-2">
      <button id="cropUndoBtn" class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-white/10 disabled:opacity-30 transition-colors" disabled title="Undo">
        <i class="ph ph-arrow-u-up-left text-lg"></i>
      </button>
      <button id="cropRedoBtn" class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-white/10 disabled:opacity-30 transition-colors" disabled title="Redo">
        <i class="ph ph-arrow-u-up-right text-lg"></i>
      </button>
    </div>
  </div>

  <div class="flex-1 overflow-hidden relative">
    <div id="panelCrop" class="absolute inset-0 flex items-center justify-center p-8">
      <div id="cropStage" class="relative overflow-hidden rounded-lg shadow-2xl">
        <img id="cropBgImg" alt="" class="block pointer-events-none select-none" draggable="false">
        <div id="cropRect" class="absolute border-2 border-brand cursor-move shadow-[0_0_0_9999px_rgba(0,0,0,0.7)] z-10">
          <div class="absolute inset-0 pointer-events-none opacity-30">
            <div class="absolute left-1/3 top-0 bottom-0 w-px bg-white"></div>
            <div class="absolute left-2/3 top-0 bottom-0 w-px bg-white"></div>
            <div class="absolute top-1/3 left-0 right-0 h-px bg-white"></div>
            <div class="absolute top-2/3 left-0 right-0 h-px bg-white"></div>
          </div>
          <div class="absolute w-3 h-3 bg-white border-2 border-brand rounded-full -top-1.5 -left-1.5 cursor-nwse-resize" data-h="nw"></div>
          <div class="absolute w-3 h-3 bg-white border-2 border-brand rounded-full -top-1.5 -right-1.5 cursor-nesw-resize" data-h="ne"></div>
          <div class="absolute w-3 h-3 bg-white border-2 border-brand rounded-full -bottom-1.5 -left-1.5 cursor-nesw-resize" data-h="sw"></div>
          <div class="absolute w-3 h-3 bg-white border-2 border-brand rounded-full -bottom-1.5 -right-1.5 cursor-nwse-resize" data-h="se"></div>
        </div>
      </div>
    </div>

    <div id="panelFilters" class="absolute inset-0 hidden flex">
      <div class="flex-1 flex items-center justify-center p-8">
        <div id="editPreviewStage" class="relative rounded-lg overflow-hidden shadow-2xl">
          <img id="editPreviewImg" alt="" class="block max-w-full max-h-[60vh] pointer-events-none select-none" draggable="false">
        </div>
      </div>
      
      <div class="w-80 bg-white/5 border-l border-white/10 p-4 overflow-y-auto text-white space-y-4">
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider text-white/50 mb-2">Presets</label>
          <div class="grid grid-cols-3 gap-1.5" id="filterPresets">
            <button class="filter-preset px-2 py-1.5 rounded-md text-[11px] font-medium bg-white/5 hover:bg-white/10 transition-colors" data-preset="original">Original</button>
            <button class="filter-preset px-2 py-1.5 rounded-md text-[11px] font-medium bg-white/5 hover:bg-white/10 transition-colors" data-preset="natural">Natural</button>
            <button class="filter-preset px-2 py-1.5 rounded-md text-[11px] font-medium bg-white/5 hover:bg-white/10 transition-colors" data-preset="warm">Warm</button>
            <button class="filter-preset px-2 py-1.5 rounded-md text-[11px] font-medium bg-white/5 hover:bg-white/10 transition-colors" data-preset="cool">Cool</button>
            <button class="filter-preset px-2 py-1.5 rounded-md text-[11px] font-medium bg-white/5 hover:bg-white/10 transition-colors" data-preset="vivid">Vivid</button>
            <button class="filter-preset px-2 py-1.5 rounded-md text-[11px] font-medium bg-white/5 hover:bg-white/10 transition-colors" data-preset="bw">B&amp;W</button>
          </div>

// ============ HISTORY ============
let history = [];
let historyIndex = -1;
let isRestoringHistory = false;

function cloneEdits(e) {
  return { ...defaultEdits(), ...(e || {}) };
}

function saveState() {
  if (isRestoringHistory) return;
  const state = {
    cropPreset: cropPreset.value,
    autoFocus: autoFocus.checked,
    autoEnhance: autoEnhance.checked,
    trimEdges: trimEdges.checked,
    bgMode: bgModeSelect.value,
    bgColor: bgColorInput.value,
    gradColor1: gradColor1.value,
    gradColor2: gradColor2.value,
    gradAngle: gradAngle.value,
    outputFormat: outputFormat.value,
    items: items.map(it => ({
      id: it.id, state: it.state,
      cropLeft: it.cropLeft, cropTop: it.cropTop, cropW: it.cropW, cropH: it.cropH,
      manualCrop: it.manualCrop,
      edits: cloneEdits(it.edits)
    }))
  };
  if (historyIndex < history.length - 1) history = history.slice(0, historyIndex + 1);
  history.push(JSON.stringify(state));
  if (history.length > 50) history.shift();
  historyIndex = history.length - 1;
  updateUndoRedoButtons();
}

function restoreState(index) {
  if (index < 0 || index >= history.length) return;
  isRestoringHistory = true;
  const state = JSON.parse(history[index]);
  cropPreset.value = state.cropPreset;
  autoFocus.checked = state.autoFocus;
  autoEnhance.checked = state.autoEnhance;
  trimEdges.checked = state.trimEdges;
  bgModeSelect.value = state.bgMode;
  bgColorInput.value = state.bgColor;
  colorHex.value = state.bgColor.toUpperCase();
  gradColor1.value = state.gradColor1;
  gradColor2.value = state.gradColor2;
  gradAngle.value = state.gradAngle;
  outputFormat.value = state.outputFormat;
  
  state.items.forEach(savedIt => {
    const liveIt = items.find(i => i.id === savedIt.id);
    if (liveIt && liveIt.state === 'done') {
      liveIt.cropLeft = savedIt.cropLeft;
      liveIt.cropTop = savedIt.cropTop;
      liveIt.cropW = savedIt.cropW;
      liveIt.cropH = savedIt.cropH;
      liveIt.manualCrop = savedIt.manualCrop;
      liveIt.edits = cloneEdits(savedIt.edits);
      
      if (liveIt.transparentCanvas) {
        liveIt.transparentFramed = cropToTarget(liveIt.transparentCanvas,
          { left: liveIt.cropLeft, top: liveIt.cropTop, w: liveIt.cropW, h: liveIt.cropH },
          liveIt.targetW, liveIt.targetH);
        liveIt.transparentFramed.toBlob(blob => {
          if (blob) {
            if (liveIt.transparentFramedUrl) URL.revokeObjectURL(liveIt.transparentFramedUrl);
            liveIt.transparentFramedUrl = URL.createObjectURL(blob);
            render();
          }
        }, 'image/png');
      }
    }
  });
  
  updateBgModeUI();
  render();
  isRestoringHistory = false;
  updateUndoRedoButtons();
}

function updateUndoRedoButtons() {
  undoBtn.disabled = processing || historyIndex <= 0;
  redoBtn.disabled = processing || historyIndex >= history.length - 1;
}

});

// ============ AI WORKER ============
const workerSrc = `
const LIBS = [
  'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm',
  'https://esm.sh/@imgly/background-removal@1.7.0',
  'https://unpkg.com/@imgly/background-removal@1.7.0/dist/index.mjs',
];
let fn = null;
async function load() {
  if (fn) return fn;
  let lastErr;
  for (const url of LIBS) {
    try { const m = await import(url); const f = m.default || m.removeBackground || m; if (typeof f === 'function') { fn = f; return f; } }
    catch (e) { lastErr = e; }
  }
  throw new Error('AI load failed: ' + (lastErr ? lastErr.message : 'unknown'));
}
self.onmessage = async (e) => {
  const { id, blob } = e.data;
  try {
    const f = await load();
    const result = await f(blob, { output: { format: 'image/png' }, progress: (key, current, total) => self.postMessage({ id, progress: { key, current, total } }) });
    self.postMessage({ id, result });
  } catch (err) { self.postMessage({ id, error: err.message || String(err) }); }
};
`;
const workerUrl = URL.createObjectURL(new Blob([workerSrc], { type: 'application/javascript' }));
let aiWorker = null, reqId = 0;
const pending = new Map();
const modelBytesByKey = new Map();

function getWorker() {
  if (aiWorker) return aiWorker;
  aiWorker = new Worker(workerUrl);
  aiWorker.onmessage = (e) => {
    const { id, result, error, progress } = e.data;
    const p = pending.get(id); if (!p) return;
    if (progress) {
      const { key, current, total } = progress;
      if (typeof current === 'number' && typeof total === 'number' && total > 0) {
        modelBytesByKey.set(key, { current, total });
        let cur = 0, tot = 0;
        for (const v of modelBytesByKey.values()) { cur += v.current; tot += v.total; }
        if (tot > 0) {
          currentModelPct = Math.min(99, Math.round(cur / tot * 100));
          updateAiStatus();
        }
      }
      return;
    }
    pending.delete(id);
    if (error) p.reject(new Error(error)); else p.resolve(result);
  };
  aiWorker.onerror = () => { for (const p of pending.values()) p.reject(new Error('Worker error')); pending.clear(); };
  return aiWorker;
}
function aiRemoveBg(blob) {
  return new Promise((resolve, reject) => {
    const id = ++reqId; pending.set(id, { resolve, reject });
    getWorker().postMessage({ id, blob });
  });
}
function ensureAiLoaded() {
  if (warmupPromise) return warmupPromise;
  warmupPromise = (async () => {
    try {
      const c = document.createElement('canvas'); c.width = 96; c.height = 96;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,96,96);
      ctx.fillStyle = '#222'; ctx.fillRect(30,30,36,36);
      const blob = await new Promise((resolve, reject) => {
        c.toBlob(b => b ? resolve(b) : reject(new Error('warmup blob failed')), 'image/png');
      });
      return await new Promise((resolve, reject) => {
        const id = ++reqId; pending.set(id, { resolve, reject });
        getWorker().postMessage({ id, blob });
      });
    } catch (err) { warmupPromise = null; throw err; }
  })();
  warmupPromise.catch(() => {});
  return warmupPromise;
}

// ============ FILTERS ============
function buildFilter(edits) {
  const parts = [];
  const effBright = edits.brightness + edits.exposure;
  if (effBright !== 100) parts.push(`brightness(${Math.max(10, effBright)}%)`);
  if (edits.contrast !== 100) parts.push(`contrast(${edits.contrast}%)`);
  if (edits.saturation !== 100) parts.push(`saturate(${edits.saturation}%)`);
  if (edits.hue !== 0) parts.push(`hue-rotate(${edits.hue}deg)`);
  if (edits.warmth !== 0) {
    if (edits.warmth > 0) {
      parts.push(`sepia(${Math.min(80, edits.warmth * 0.8)}%)`);
      parts.push(`hue-rotate(-${edits.warmth * 0.15}deg)`);
    } else {
      parts.push(`hue-rotate(${Math.abs(edits.warmth) * 0.3}deg)`);
    }
  }
  if (edits.blur > 0) parts.push(`blur(${edits.blur}px)`);
  return parts.length ? parts.join(' ') : 'none';
}

const FILTER_PRESETS = {
  original: defaultEdits(),
  natural: { ...defaultEdits(), brightness: 105, contrast: 105, saturation: 108 },
  warm:    { ...defaultEdits(), warmth: 25, saturation: 110, brightness: 103 },
  cool:    { ...defaultEdits(), warmth: -20, saturation: 105 },
  vivid:   { ...defaultEdits(), saturation: 135, contrast: 112 },
  bw:      { ...defaultEdits(), saturation: 0 },
};

// ============ FIX #2: Filter only subject, not bg ============
function applyEditsAndComposite(transparentFramed, bg, edits) {
  const c = document.createElement('canvas');
  c.width = transparentFramed.width;
  c.height = transparentFramed.height;
  const ctx = c.getContext('2d');
  
  // Draw bg UNFILTERED
  ctx.filter = 'none';
  if (bg.type === 'solid') {
    if (bg.color) { ctx.fillStyle = bg.color; ctx.fillRect(0, 0, c.width, c.height); }
  } else {
    const angleRad = (bg.angle * Math.PI) / 180;
    const x1 = c.width / 2 - Math.cos(angleRad) * c.width / 2;
    const y1 = c.height / 2 - Math.sin(angleRad) * c.height / 2;
    const x2 = c.width / 2 + Math.cos(angleRad) * c.width / 2;
    const y2 = c.height / 2 + Math.sin(angleRad) * c.height / 2;
    const grad = ctx.createLinearGradient(x1, y1, x2, y2);
    grad.addColorStop(0, bg.c1);
    grad.addColorStop(1, bg.c2);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, c.width, c.height);
  }
  
  // Draw subject WITH filter
  ctx.filter = buildFilter(edits);
  ctx.drawImage(transparentFramed, 0, 0);
  ctx.filter = 'none';
  return c;
}

// ============ HELPERS ============
const CROP_PRESETS = {
  'bd-passport':{w:472,h:590}, 'bd-visa':{w:413,h:531}, 'us-passport':{w:600,h:600},
  'schengen-visa':{w:413,h:531}, 'india-passport':{w:413,h:413}, 'china-visa':{w:390,h:567}, 'square':{w:500,h:500},
};
const AI_MAX = 512, MAX_ORIG = 1400;

function getOutputFormat() {
  const v = outputFormat.value;
  if (v === 'image/png') return { mime:'image/png', ext:'png', opaque:false };
  if (v === 'image/jpeg') return { mime:'image/jpeg', ext:'jpg', opaque:true };
  return { mime:'image/webp', ext:'webp', opaque:false };
}

// ============ FIX #7: Size min/max guard ============
function getSizeTargets() {
  const sMinVal = parseInt(sizeMin.value) || 20;
  const sMaxVal = parseInt(sizeMax.value) || 50;
  return {
    min: Math.min(sMinVal, sMaxVal) * 1024,
    max: Math.max(sMinVal, sMaxVal) * 1024
  };
}

function getTargetDims() {
  const p = cropPreset.value;
  if (p === 'custom') {
    const w = parseInt(customCropW.value)||null, h = parseInt(customCropH.value)||null;
    return (w && h) ? { w, h } : null;
  }
  const pp = CROP_PRESETS[p];
  return pp ? { w: pp.w, h: pp.h } : null;
}

async function detectFace(canvas) {
  if (typeof FaceDetector === 'undefined') return null;
  try {
    const fd = new FaceDetector({ fastMode:true, maxDetectedFaces:5 });
    const faces = await fd.detect(canvas);
    if (!faces.length) return null;
    const largest = faces.reduce((a,b) => {
      const aA = a.boundingBox.width*a.boundingBox.height;
      const bA = b.boundingBox.width*b.boundingBox.height;
      return aA > bA ? a : b;
    });
    const bb = largest.boundingBox;
    return { x:bb.x, y:bb.y, w:bb.width, h:bb.height };
  } catch(e) { return null; }
}

function computeDefaultCrop(srcCanvas, faceBox, targetW, targetH) {
  const aspect = targetW / targetH;
  const HEAD_RATIO = 0.62, EYE_FROM_TOP = 0.38;
  let cropLeft, cropTop, cropW, cropH;
  if (faceBox) {
    const faceCenterX = faceBox.x + faceBox.w / 2;
    const estimatedHeadH = faceBox.h * 1.35;
    const eyeY = faceBox.y + faceBox.h * 0.40;
    cropH = estimatedHeadH / HEAD_RATIO; cropW = cropH * aspect;
    const minCropH = srcCanvas.height / 3.5;
    if (cropH < minCropH) { cropH = minCropH; cropW = cropH * aspect; }
    cropLeft = faceCenterX - cropW / 2;
    cropTop = eyeY - cropH * EYE_FROM_TOP;
  } else {
    cropH = srcCanvas.height * 0.85; cropW = cropH * aspect;
    if (cropW > srcCanvas.width) { cropW = srcCanvas.width; cropH = cropW / aspect; }
    cropLeft = (srcCanvas.width - cropW) / 2;
    cropTop = srcCanvas.height * 0.02;
  }
  return { left: cropLeft, top: cropTop, w: cropW, h: cropH };
}

function cropToTarget(srcCanvas, crop, targetW, targetH) {
  const out = document.createElement('canvas');
  out.width = targetW; out.height = targetH;
  const ctx = out.getContext('2d');
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  const sx = targetW / crop.w, sy = targetH / crop.h;
  const dx = -crop.left * sx, dy = -crop.top * sy;
  const dw = srcCanvas.width * sx, dh = srcCanvas.height * sy;
  ctx.drawImage(srcCanvas, dx, dy, dw, dh);
  return out;
}

function trimTransparent(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  let data; try { data = ctx.getImageData(0,0,w,h).data; } catch(e){ return canvas; }
  let minX=w,minY=h,maxX=-1,maxY=-1;
  const step = 2;
  for (let y=0;y<h;y+=step) for (let x=0;x<w;x+=step) {
    if (data[(y*w+x)*4+3] > 15) {
      if (x<minX) minX=x; if (x>maxX) maxX=x;
      if (y<minY) minY=y; if (y>maxY) maxY=y;
    }
  }
  if (maxX < 0) return canvas;
  const pad = Math.round(Math.min(maxX-minX, maxY-minY) * 0.02);
  minX = Math.max(0, minX-pad); minY = Math.max(0, minY-pad);
  maxX = Math.min(w-1, maxX+pad); maxY = Math.min(h-1, maxY+pad);
  const outW = maxX-minX+1, outH = maxY-minY+1;
  if (outW < 10 || outH < 10) return canvas;
  const out = document.createElement('canvas');
  out.width = outW; out.height = outH;
  out.getContext('2d').drawImage(canvas, minX, minY, outW, outH, 0, 0, outW, outH);
  return out;
}

function downscaleCanvas(src, maxDim) {
  const { width, height } = src;
  if (Math.max(width, height) <= maxDim) return src;
  const s = maxDim / Math.max(width, height);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(width*s)); c.height = Math.max(1, Math.round(height*s));
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, c.width, c.height);
  return c;
}

function makeEncoder(canvas, mime) {
  let offscreen = null;
  if (typeof OffscreenCanvas !== 'undefined') {
    try { offscreen = new OffscreenCanvas(canvas.width, canvas.height); offscreen.getContext('2d').drawImage(canvas, 0, 0); }
    catch(e){ offscreen = null; }
  }
  return async function(quality) {
    if (offscreen) { try { return await offscreen.convertToBlob({ type: mime, quality }); } catch(e){} }
    return await new Promise(res => canvas.toBlob(res, mime, quality));
  };
}

async function encodeToTarget(canvas, targetMin, targetMax, mime) {
  const encode = makeEncoder(canvas, mime);
  const targetMid = (targetMin + targetMax) / 2;
  let blob = await encode(0.75);
  if (blob && blob.size >= targetMin && blob.size <= targetMax) return blob;
  let q = 0.75;
  if (blob) { const ratio = targetMid / blob.size; q = Math.max(0.3, Math.min(0.9, q * ratio)); blob = await encode(q); if (blob && blob.size >= targetMin && blob.size <= targetMax) return blob; }
  if (blob) { const ratio = targetMid / blob.size; q = Math.max(0.2, Math.min(0.92, q * ratio)); blob = await encode(q); if (blob && blob.size <= targetMax) return blob; }
  for (const maxDim of [600,400,300,200]) {
    const small = downscaleCanvas(canvas, maxDim);
    const enc2 = makeEncoder(small, mime);
    const b = await enc2(0.7);
    if (b && b.size <= targetMax) return b;
  }
  return blob;
}

// ============ PROCESS ============
cropPreset.addEventListener('change', () => {
  customCropGroup.style.display = cropPreset.value === 'custom' ? 'grid' : 'none';
  saveState();
});
autoFocus.addEventListener('change', saveState);
autoEnhance.addEventListener('change', saveState);
trimEdges.addEventListener('change', saveState);
outputFormat.addEventListener('change', () => {
  const fmt = getOutputFormat();
  items.forEach(it => { if (it.state !== 'done') it.outputName = it.file.name.replace(/\.[^.]+$/, '') + '.' + fmt.ext; });
  render(); saveState();
});
sizeMin.addEventListener('change', saveState);
sizeMax.addEventListener('change', saveState);

async function processItem(it) {
  it.state = 'processing';
  it.progress = 5; it.stage = 'Loading image';
  updateCardProgress(it);
  await new Promise(r => setTimeout(r, 10));

  let bitmap;
  try { bitmap = await createImageBitmap(it.file, { imageOrientation:'from-image' }); }
  catch { bitmap = await createImageBitmap(it.file); }

  const scale0 = Math.min(1, MAX_ORIG / Math.max(bitmap.width, bitmap.height));
  const ow = Math.max(1, Math.round(bitmap.width*scale0));
  const oh = Math.max(1, Math.round(bitmap.height*scale0));
  const original = document.createElement('canvas');
  original.width = ow; original.height = oh;
  const octx = original.getContext('2d');
  octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = 'high';
  if (autoEnhance.checked) octx.filter = 'brightness(1.06) contrast(1.08) saturate(1.05)';
  octx.drawImage(bitmap, 0, 0, ow, oh);
  octx.filter = 'none';
  bitmap.close();

  let faceBox = null;
  if (autoFocus.checked) {
    it.progress = 15; it.stage = 'Detecting face'; updateCardProgress(it);
    faceBox = await detectFace(original);
    await new Promise(r => setTimeout(r, 10));
  }

  it.progress = 30; it.stage = 'Preparing AI'; updateCardProgress(it);
  const aiScale = Math.min(1, AI_MAX / Math.max(original.width, original.height));
  const aiW = Math.max(1, Math.round(original.width*aiScale));
  const aiH = Math.max(1, Math.round(original.height*aiScale));
  const aiInput = document.createElement('canvas');
  aiInput.width = aiW; aiInput.height = aiH;
  aiInput.getContext('2d').drawImage(original, 0, 0, aiW, aiH);

  let faceBoxAI = null;
  if (faceBox) {
    const sx = aiW / original.width, sy = aiH / original.height;
    faceBoxAI = { x: faceBox.x*sx, y: faceBox.y*sy, w: faceBox.w*sx, h: faceBox.h*sy };
  }

  it.progress = 55; it.stage = 'Removing background'; updateCardProgress(it);
  const aiBlob = await new Promise(res => aiInput.toBlob(res, 'image/png'));
  if (!aiBlob) throw new Error('Could not prepare image');
  const transparentBlob = await aiRemoveBg(aiBlob);
  if (!transparentBlob) throw new Error('AI returned no result');

  it.progress = 75; it.stage = 'Reading subject'; updateCardProgress(it);
  let transparentCanvas;
  try {
    const ab = await createImageBitmap(transparentBlob);
    transparentCanvas = document.createElement('canvas');
    transparentCanvas.width = ab.width; transparentCanvas.height = ab.height;
    transparentCanvas.getContext('2d').drawImage(ab, 0, 0);
    ab.close();
  } catch(e) {
    transparentCanvas = document.createElement('canvas');
    transparentCanvas.width = aiW; transparentCanvas.height = aiH;
    transparentCanvas.getContext('2d').drawImage(aiInput, 0, 0);
  }

  if (trimEdges.checked) {
    const trimmed = trimTransparent(transparentCanvas);
    if (trimmed !== transparentCanvas) {
      const sx = trimmed.width / transparentCanvas.width;
      const sy = trimmed.height / transparentCanvas.height;
      transparentCanvas = trimmed;
      if (faceBoxAI) faceBoxAI = { x: faceBoxAI.x*sx, y: faceBoxAI.y*sy, w: faceBoxAI.w*sx, h: faceBoxAI.h*sy };
    }
  }
  await new Promise(r => setTimeout(r, 10));

  it.progress = 85; it.stage = 'Framing'; updateCardProgress(it);
  const target = getTargetDims();
  let transparentFramed, crop;
  if (target) {
    crop = computeDefaultCrop(transparentCanvas, autoFocus.checked ? faceBoxAI : null, target.w, target.h);
    transparentFramed = cropToTarget(transparentCanvas, crop, target.w, target.h);
    it.cropLeft = crop.left; it.cropTop = crop.top;
    it.cropW = crop.w; it.cropH = crop.h;
    it.targetW = target.w; it.targetH = target.h;
    it.manualCrop = false;
  } else {
    transparentFramed = transparentCanvas;
    it.targetW = transparentCanvas.width; it.targetH = transparentCanvas.height;
    it.cropLeft = 0; it.cropTop = 0;
    it.cropW = transparentCanvas.width; it.cropH = transparentCanvas.height;
    it.manualCrop = false;
  }
  it.transparentCanvas = transparentCanvas;
  it.faceBoxAI = faceBoxAI;

  const previewBlob = await new Promise(res => transparentFramed.toBlob(res, 'image/png'));
  if (it.transparentFramedUrl) URL.revokeObjectURL(it.transparentFramedUrl);
  it.transparentFramedUrl = previewBlob ? URL.createObjectURL(previewBlob) : '';
  it.transparentFramed = transparentFramed;

  it.progress = 95; it.stage = 'Encoding'; updateCardProgress(it);
  const fmt = getOutputFormat();
  const bg = getCurrentBg();
  const { min: tMin, max: tMax } = getSizeTargets();
  const composed = applyEditsAndComposite(transparentFramed, bg, it.edits);
  const blob = await encodeToTarget(composed, tMin, tMax, fmt.mime);
  if (blob) it.sizeKB = blob.size / 1024;

  it.state = 'done';
  it.progress = 100;
  it.outputName = it.file.name.replace(/\.[^.]+$/, '') + '.' + fmt.ext;
  it.faceDetected = !!faceBoxAI;
}

processBtn.addEventListener('click', async () => {
  if (processing || items.length === 0) return;
  if (currentPillState !== 'ready') {
    currentPillState = 'loading'; updateAiStatus();
    try { await ensureAiLoaded(); currentPillState = 'ready'; updateAiStatus(); modelBytesByKey.clear(); }
    catch (err) { currentPillState = 'fail'; updateAiStatus(); showToast('AI failed to load', 'error'); return; }
  }
  processing = true; updateButtons();
  for (const it of items) {
    it.state = 'pending'; it.progress = 0;
    if (it.transparentFramedUrl) { URL.revokeObjectURL(it.transparentFramedUrl); it.transparentFramedUrl = null; }
    it.transparentFramed = null; it.transparentCanvas = null; it.sizeKB = 0; it.manualCrop = false;
  }
  render();
  let done = 0;
  for (const it of items) {
    it.state = 'processing'; render();
    await new Promise(r => setTimeout(r, 10));
    try { await processItem(it); done++; }
    catch(err) { console.error('Failed:', it.file.name, err); it.state = 'error'; it.error = err.message; }
    render(); updateButtons();
  }
  processing = false; updateButtons();
  showToast(`Processed ${done}/${items.length} images`, 'success');
  saveState();
});

function updateButtons() {
  const hasItems = items.length > 0;
  const aiLoading = currentPillState === 'loading';
  const anyDone = items.some(it => it.state === 'done' && it.transparentFramed);
  if (processing) {
    processBtn.disabled = true;
    processBtnText.innerHTML = `<i class="ph ph-spinner animate-spin text-lg inline-block mr-2"></i> Processing...`;
  } else if (!hasItems) {
    processBtn.disabled = true; processBtnText.textContent = 'Process All';
  } else if (aiLoading) {
    processBtn.disabled = true; processBtnText.textContent = `Wait for AI (${currentModelPct}%)`;
  } else {
    processBtn.disabled = false;
    processBtnText.innerHTML = `<i class="ph ph-play-circle text-lg"></i> Process All`;
  }
  downloadZipBtn.disabled = !anyDone || processing;
  // Also refresh undo/redo state
  undoBtn.disabled = processing || historyIndex <= 0;
  redoBtn.disabled = processing || historyIndex >= history.length - 1;
}

// ============ RENDER ============
function render() {
  library.innerHTML = '';
  libCount.textContent = items.length;
  const bg = getCurrentBg();

  items.forEach(it => {
    const card = document.createElement('div');
    card.className = 'card group bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden relative flex flex-col shadow-soft transition-all hover:shadow-lift hover:-translate-y-0.5 select-none';
    card.draggable = !processing;
    card.dataset.id = it.id;
    card.dataset.state = it.state;

    card.addEventListener('dragstart', handleDragStart);
    card.addEventListener('dragover', handleDragOver);
    card.addEventListener('drop', handleDrop);
    card.addEventListener('dragend', handleDragEnd);
    card.addEventListener('dragleave', handleDragLeave);

    const isProcessing = it.state === 'processing';
    const isDone = it.state === 'done';
    const isError = it.state === 'error';
    const edits = cloneEdits(it.edits);
    const filterCss = buildFilter(edits);

    let imgHtml = '';
    if (isDone && it.transparentFramedUrl) {
      const isTransparent = bg.type === 'solid' && !bg.color;
      const thumbClass = isTransparent ? 'checker-soft' : '';
      const thumbStyle = isTransparent ? '' : `background:${getBgCss(bg)}`;
      imgHtml = `<div class="thumb w-full aspect-[4/5] relative flex items-center justify-center overflow-hidden ${thumbClass}" style="${thumbStyle}"><img src="${it.transparentFramedUrl}" style="filter:${filterCss}" class="max-w-full max-h-full object-contain pointer-events-none"></div>`;
    } else if (isProcessing) {
      imgHtml = `
        <div class="thumb w-full aspect-[4/5] relative overflow-hidden bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 processing-glow">
          <div class="absolute inset-0 flex items-center justify-center">
            <div class="relative w-24 h-24">
              <div class="absolute inset-0 rounded-full border-2 border-brand/30 orbit-ring" style="border-top-color:#3b82f6; border-right-color:transparent"></div>
              <div class="absolute inset-2 rounded-full border-2 border-violet-500/30 orbit-ring-slow" style="border-bottom-color:#8b5cf6; border-left-color:transparent"></div>
              <div class="absolute inset-0 flex items-center justify-center">
                <div class="text-white text-2xl font-bold tabular-nums">${Math.round(it.progress)}%</div>
              </div>
            </div>
          </div>
          <div class="absolute bottom-0 left-0 right-0 p-3 bg-gradient-to-t from-black/60 to-transparent">
            <div class="text-[10px] text-white/90 uppercase tracking-wider font-semibold text-center mb-1.5">${it.stage || 'Working'}</div>
            <div class="w-full h-1 bg-white/20 rounded-full overflow-hidden">
              <div class="h-full bg-gradient-to-r from-brand to-violet-500 rounded-full transition-all duration-300" style="width:${it.progress}%"></div>
            </div>
          </div>
        </div>
      `;
    } else {
      imgHtml = `<div class="thumb w-full aspect-[4/5] relative flex items-center justify-center overflow-hidden bg-slate-50 dark:bg-slate-800/50"><img src="${it.thumbUrl}" class="max-w-full max-h-full object-contain opacity-50 pointer-events-none"></div>`;
    }

    let badgeHtml = '';
    if (isDone) badgeHtml = `<div class="absolute top-2 left-2 bg-emerald-500/90 backdrop-blur text-white text-[9px] font-bold px-2 py-0.5 rounded-full shadow-sm tracking-wide">DONE</div>`;
    else if (isError) badgeHtml = `<div class="absolute top-2 left-2 bg-red-500/90 backdrop-blur text-white text-[9px] font-bold px-2 py-0.5 rounded-full shadow-sm tracking-wide">ERROR</div>`;

    let overlayHtml = '';
    if (isDone && !processing) {
      overlayHtml = `
        <div class="absolute inset-0 bg-slate-900/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2 z-10">
          <button class="edit-btn w-9 h-9 rounded-full bg-white/20 hover:bg-white/40 backdrop-blur text-white flex items-center justify-center transition-colors" title="Edit Photo"><i class="ph ph-pencil-simple text-lg"></i></button>
          <button class="dl-btn w-9 h-9 rounded-full bg-brand hover:bg-brand-hover text-white flex items-center justify-center shadow-lg transition-colors" title="Download"><i class="ph ph-download-simple text-lg"></i></button>
        </div>
        <button class="remove-btn absolute top-2 right-2 w-6 h-6 rounded-full bg-slate-900/50 hover:bg-red-500 text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all z-20" title="Remove"><i class="ph ph-x text-xs"></i></button>
      `;
    }

    let metaHtml = `
      <div class="px-3 py-2 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 flex flex-col gap-0.5 relative z-20">
        <div class="text-[11px] font-medium text-slate-700 dark:text-slate-300 truncate" title="${it.file.name}">${it.file.name}</div>
        <div class="flex justify-between items-center text-[10px] text-slate-400">
          <span>${(it.file.size/1024).toFixed(0)} KB</span>
          ${isDone && it.sizeKB ? `<span class="text-emerald-500 font-medium">→ ${it.sizeKB.toFixed(0)} KB</span>` : ''}
        </div>
      </div>
    `;

    card.innerHTML = `${imgHtml}${badgeHtml}${overlayHtml}${metaHtml}`;

    if (isDone) {
      card.querySelector('.edit-btn').addEventListener('click', (e) => { e.stopPropagation(); openEditModal(it); });
      card.querySelector('.dl-btn').addEventListener('click', async (e) => { e.stopPropagation(); await downloadOne(it); });
      card.querySelector('.remove-btn').addEventListener('click', (e) => { e.stopPropagation(); removeItem(it.id); });
    }

    library.appendChild(card);
  });

  if (items.length > 0) {
    dropZone.classList.add('hidden');
    libraryHeader.classList.remove('hidden');
    libraryHeader.classList.add('flex');
  } else {
    dropZone.classList.remove('hidden');
    libraryHeader.classList.add('hidden');
    libraryHeader.classList.remove('flex');
  }
}

function updateCardProgress(item) {
  const card = library.querySelector(`.card[data-id="${item.id}"]`);
  if (!card) return;
  const pct = card.querySelector('.text-2xl.tabular-nums');
  const barEl = card.querySelector('.bg-white\\/20 > div');
  const stage = card.querySelector('.processing-glow .text-\\[10px\\]');
  if (pct) pct.textContent = Math.round(item.progress) + '%';
  if (barEl) barEl.style.width = item.progress + '%';
  if (stage) stage.textContent = item.stage || 'Working';
}

function removeItem(id) {
  if (processing) { showToast('Please wait for processing to finish', 'error'); return; }
  const it = items.find(i => i.id === id);
  if (!it) return;
  if (it.thumbUrl) URL.revokeObjectURL(it.thumbUrl);
  if (it.transparentFramedUrl) URL.revokeObjectURL(it.transparentFramedUrl);
  items = items.filter(x => x.id !== id);
  render(); updateButtons(); saveState();
}

// ============ DRAG & DROP REORDER ============
let dragSrcId = null;
function handleDragStart(e) {
  if (processing) { e.preventDefault(); return; }
  dragSrcId = parseInt(this.dataset.id);
  this.classList.add('opacity-40');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragSrcId);
}
function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; this.classList.add('ring-2','ring-brand'); }
function handleDragLeave() { this.classList.remove('ring-2','ring-brand'); }
function handleDrop(e) {
  e.stopPropagation();
  this.classList.remove('ring-2','ring-brand');
  const targetId = parseInt(this.dataset.id);
  if (dragSrcId !== null && dragSrcId !== targetId) {
    const srcIdx = items.findIndex(i => i.id === dragSrcId);
    const tgtIdx = items.findIndex(i => i.id === targetId);
    if (srcIdx > -1 && tgtIdx > -1) {
      const [moved] = items.splice(srcIdx, 1);
      items.splice(tgtIdx, 0, moved);
      render(); saveState();
    }
  }
}
function handleDragEnd() {
  this.classList.remove('opacity-40');
  library.querySelectorAll('.card').forEach(c => c.classList.remove('ring-2','ring-brand'));
  dragSrcId = null;
}

// ============ DOWNLOADS ============
function saveBlob(blob, filename) {
  if (!blob || !blob.size) return false;
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click();
    setTimeout(() => { try { a.remove(); }catch{} URL.revokeObjectURL(url); }, 60000);
    return true;
  } catch(e) { return false; }
}

async function getFinalBlob(item) {
  const fmt = getOutputFormat();
  const bg = getCurrentBg();
  const { min: tMin, max: tMax } = getSizeTargets();
  const composed = applyEditsAndComposite(item.transparentFramed, bg, cloneEdits(item.edits));
  return await encodeToTarget(composed, tMin, tMax, fmt.mime);
}

async function downloadOne(item) {
  if (!item.transparentFramed) return;
  const fmt = getOutputFormat();
  const blob = await getFinalBlob(item);
  if (!blob) { showToast('Download failed', 'error'); return; }
  const name = item.file.name.replace(/\.[^.]+$/, '') + '.' + fmt.ext;
  saveBlob(blob, name);
  showToast(`Saved ${name}`, 'success');
}

downloadZipBtn.addEventListener('click', async () => {
  const ready = items.filter(it => it.state === 'done' && it.transparentFramed);
  if (!ready.length) return;
  if (typeof JSZip === 'undefined') { showToast('ZIP library missing', 'error'); return; }
  showToast('Building ZIP...', 'info');
  try {
    const fmt = getOutputFormat();
    const zip = new JSZip();
    const used = new Set();
    for (const it of ready) {
      const blob = await getFinalBlob(it);
      if (!blob) continue;
      let name = it.file.name.replace(/\.[^.]+$/, '') + '.' + fmt.ext;
      if (used.has(name)) {
        const b = name.replace(/\.[^.]+$/, '');
        const ext = name.split('.').pop();
        let n = 2;
        while (used.has(`${b}_${n}.${ext}`)) n++;
        name = `${b}_${n}.${ext}`;
      }
      used.add(name);
      zip.file(name, blob);
    }
    const zipBlob = await zip.generateAsync({ type:'blob', compression:'DEFLATE', compressionOptions:{ level:6 } });
    if (!zipBlob || !zipBlob.size) throw new Error('ZIP empty');
    saveBlob(zipBlob, 'readychobi-photos.zip');
    showToast(`ZIP downloaded (${(zipBlob.size/1024).toFixed(0)} KB)`, 'success');
  } catch(e) { showToast('ZIP creation failed', 'error'); }
});

// ============ EDIT MODAL ============
function openEditModal(item) {
  if (item.state !== 'done' || !item.transparentCanvas) return;
  
  editSession = {
    item,
    tab: 'crop',
    cropState: null,
    edits: cloneEdits(item.edits),
    history: [],
    historyIdx: -1
  };

  setupCropUI(item);
  setupFiltersUI(item);
  showTab('crop');
  
  editModal.classList.remove('hidden');
  editModal.classList.add('flex');
}

function closeEditModal() {
  editModal.classList.add('hidden');
  editModal.classList.remove('flex');
  if (editSession && editSession.item && editSession.item._cropBgUrl) {
    URL.revokeObjectURL(editSession.item._cropBgUrl);
    editSession.item._cropBgUrl = null;
  }
  editSession = null;
}

editModalClose.addEventListener('click', closeEditModal);
editCancel.addEventListener('click', closeEditModal);
editModal.addEventListener('click', e => { if (e.target === editModal) closeEditModal(); });
document.addEventListener('keydown', e => {
  if (!editModal.classList.contains('hidden')) {
    if (e.key === 'Escape') closeEditModal();
    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); cropUndoBtn.click(); }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'z'))) { e.preventDefault(); cropRedoBtn.click(); }
  }
});

function showTab(tab) {
  if (!editSession) return;
  editSession.tab = tab;
  if (tab === 'crop') {
    tabCrop.className = 'tab-btn px-4 py-1.5 rounded-md text-xs font-semibold transition-all bg-white/10 text-white';
    tabFilters.className = 'tab-btn px-4 py-1.5 rounded-md text-xs font-semibold transition-all text-white/60 hover:text-white';
    panelCrop.classList.remove('hidden');
    panelFilters.classList.add('hidden');
    panelFilters.classList.remove('flex');
    updateCropUndoRedoButtons();
  } else {
    tabFilters.className = 'tab-btn px-4 py-1.5 rounded-md text-xs font-semibold transition-all bg-white/10 text-white';
    tabCrop.className = 'tab-btn px-4 py-1.5 rounded-md text-xs font-semibold transition-all text-white/60 hover:text-white';
    panelFilters.classList.remove('hidden');
    panelFilters.classList.add('flex');
    panelCrop.classList.add('hidden');
    cropUndoBtn.disabled = true;
    cropRedoBtn.disabled = true;
  }
}
tabCrop.addEventListener('click', () => showTab('crop'));
tabFilters.addEventListener('click', () => showTab('filters'));

// --- Crop UI ---
function setupCropUI(item) {
  const cw = item.transparentCanvas.width;
  const ch = item.transparentCanvas.height;
  const maxW = window.innerWidth - 160;
  const maxH = window.innerHeight - 200;
  const scale = Math.min(maxW / cw, maxH / ch, 1);
  const stageW = Math.round(cw * scale);
  const stageH = Math.round(ch * scale);

  cropStage.style.width = stageW + 'px';
  cropStage.style.height = stageH + 'px';
  cropStage.style.background = getBgCss(getCurrentBg()) || 'transparent';

  item.transparentCanvas.toBlob(blob => {
    if (item._cropBgUrl) URL.revokeObjectURL(item._cropBgUrl);
    item._cropBgUrl = URL.createObjectURL(blob);
    cropBgImg.src = item._cropBgUrl;
  }, 'image/png');
  cropBgImg.width = stageW; cropBgImg.height = stageH;

  const aspect = item.targetW / item.targetH;
  let rect = {
    x: (item.cropLeft || 0) * scale,
    y: (item.cropTop  || 0) * scale,
    w: (item.cropW    || cw) * scale,
    h: (item.cropH    || ch) * scale,
  };
  rect.w = Math.max(40, Math.min(rect.w, stageW));
  rect.h = Math.max(40, Math.min(rect.h, stageH));
  rect.x = Math.max(0, Math.min(stageW - rect.w, rect.x));
  rect.y = Math.max(0, Math.min(stageH - rect.h, rect.y));

  editSession.cropState = {
    cw, ch, scale, stageW, stageH, aspect, rect, minSize: 40,
    dragging: null, startX: 0, startY: 0, startRect: null,
    history: [{ ...rect }], historyIdx: 0
  };

  updateCropRectEl();
  updateCropUndoRedoButtons();
}

function updateCropRectEl() {
  if (!editSession || !editSession.cropState) return;
  const r = editSession.cropState.rect;
  cropRect.style.left = r.x + 'px'; cropRect.style.top = r.y + 'px';
  cropRect.style.width = r.w + 'px'; cropRect.style.height = r.h + 'px';
}

function pushCropHistory() {
  if (!editSession || !editSession.cropState) return;
  const cs = editSession.cropState;
  const h = cs.history.slice(0, cs.historyIdx + 1);
  h.push({ ...cs.rect });
  if (h.length > 30) h.shift();
  cs.history = h; cs.historyIdx = h.length - 1;
  updateCropUndoRedoButtons();
}

function updateCropUndoRedoButtons() {
  if (!editSession || !editSession.cropState || editSession.tab !== 'crop') {
    cropUndoBtn.disabled = true; cropRedoBtn.disabled = true;
    return;
  }
  cropUndoBtn.disabled = editSession.cropState.historyIdx <= 0;
  cropRedoBtn.disabled = editSession.cropState.historyIdx >= editSession.cropState.history.length - 1;
}

cropUndoBtn.addEventListener('click', () => {
  if (!editSession || !editSession.cropState) return;
  const cs = editSession.cropState;
  if (cs.historyIdx <= 0) return;
  cs.historyIdx--;
  cs.rect = { ...cs.history[cs.historyIdx] };
  updateCropRectEl(); updateCropUndoRedoButtons();
});
cropRedoBtn.addEventListener('click', () => {
  if (!editSession || !editSession.cropState) return;
  const cs = editSession.cropState;
  if (cs.historyIdx >= cs.history.length - 1) return;
  cs.historyIdx++;
  cs.rect = { ...cs.history[cs.historyIdx] };
  updateCropRectEl(); updateCropUndoRedoButtons();
});

cropRect.addEventListener('pointerdown', e => {
  if (!editSession || !editSession.cropState) return;
  e.preventDefault(); e.stopPropagation();
  const cs = editSession.cropState;
  cs.dragging = e.target.dataset.h || 'move';
  cs.startX = e.clientX; cs.startY = e.clientY;
  cs.startRect = { ...cs.rect };
  cropRect.setPointerCapture(e.pointerId);
});
cropRect.addEventListener('pointermove', e => {
  if (!editSession || !editSession.cropState || !editSession.cropState.dragging) return;
  const cs = editSession.cropState;
  const dx = e.clientX - cs.startX, dy = e.clientY - cs.startY;
  const sr = cs.startRect;
  const { stageW, stageH, aspect, minSize } = cs;
  let r = { ...sr };
  if (cs.dragging === 'move') {
    r.x = Math.max(0, Math.min(stageW - r.w, sr.x + dx));
    r.y = Math.max(0, Math.min(stageH - r.h, sr.y + dy));
  } else {
    const h = cs.dragging;
    let newW = sr.w, newH = sr.h;
    if (h === 'se') { newW = sr.w+dx; newH = newW/aspect;
      if (sr.x+newW>stageW) { newW=stageW-sr.x; newH=newW/aspect; }
      if (sr.y+newH>stageH) { newH=stageH-sr.y; newW=newH*aspect; } }
    else if (h === 'nw') { newW = sr.w-dx; newH = newW/aspect;
      if (sr.x+sr.w-newW<0) { newW=sr.x+sr.w; newH=newW/aspect; }
      if (sr.y+sr.h-newH<0) { newH=sr.y+sr.h; newW=newH*aspect; }
      r.x = sr.x+sr.w-newW; r.y = sr.y+sr.h-newH; }
    else if (h === 'ne') { newW = sr.w+dx; newH = newW/aspect;
      if (sr.x+newW>stageW) { newW=stageW-sr.x; newH=newW/aspect; }
      if (sr.y+sr.h-newH<0) { newH=sr.y+sr.h; newW=newH*aspect; }
      r.y = sr.y+sr.h-newH; }
    else if (h === 'sw') { newW = sr.w-dx; newH = newW/aspect;
      if (sr.x+sr.w-newW<0) { newW=sr.x+sr.w; newH=newW/aspect; }
      if (sr.y+newH>stageH) { newH=stageH-sr.y; newW=newH*aspect; }
      r.x = sr.x+sr.w-newW; }
    if (newW < minSize) { newW = minSize; newH = newW/aspect; }
    r.w = newW; r.h = newH;
  }
  cs.rect = r;
  updateCropRectEl();
});
function endDrag() {
  if (editSession && editSession.cropState && editSession.cropState.dragging) {
    editSession.cropState.dragging = null;
    pushCropHistory();
  }
}
cropRect.addEventListener('pointerup', endDrag);
cropRect.addEventListener('pointercancel', endDrag);

// --- Filters UI ---
function setupFiltersUI(item) {
  const bg = getCurrentBg();
  const bgCss = getBgCss(bg);
  if (bg.type === 'solid' && !bg.color) {
    editPreviewStage.style.background = '';
    editPreviewStage.classList.add('checker-soft');
  } else {
    editPreviewStage.classList.remove('checker-soft');
    editPreviewStage.style.background = bgCss;
  }
  
  if (!item.transparentFramedUrl) {
    item.transparentFramed.toBlob(blob => {
      if (blob) {
        if (item.transparentFramedUrl) URL.revokeObjectURL(item.transparentFramedUrl);
        item.transparentFramedUrl = URL.createObjectURL(blob);
        editPreviewImg.src = item.transparentFramedUrl;
        applyPreviewFilter();
      }
    }, 'image/png');
  } else {
    editPreviewImg.src = item.transparentFramedUrl;
    applyPreviewFilter();
  }
  
  $('f_brightness').value = editSession.edits.brightness;
  $('f_exposure').value = editSession.edits.exposure;
  $('f_contrast').value = editSession.edits.contrast;
  $('f_saturation').value = editSession.edits.saturation;
  $('f_hue').value = editSession.edits.hue;
  $('f_warmth').value = editSession.edits.warmth;
  $('f_blur').value = editSession.edits.blur;
  updateEditValuesUI();
}

// ============ FIX #3: Filter only img, not stage ============
function applyPreviewFilter() {
  if (!editSession) return;
  const filter = buildFilter(editSession.edits);
  editPreviewImg.style.filter = filter;
}

function updateEditValuesUI() {
  if (!editSession) return;
  const e = editSession.edits;
  document.querySelector('.edit-val[data-for="brightness"]').textContent = e.brightness + '%';
  document.querySelector('.edit-val[data-for="exposure"]').textContent = (e.exposure > 0 ? '+' : '') + e.exposure;
  document.querySelector('.edit-val[data-for="contrast"]').textContent = e.contrast + '%';
  document.querySelector('.edit-val[data-for="saturation"]').textContent = e.saturation + '%';
  document.querySelector('.edit-val[data-for="hue"]').textContent = e.hue + '°';
  document.querySelector('.edit-val[data-for="warmth"]').textContent = e.warmth;
  document.querySelector('.edit-val[data-for="blur"]').textContent = e.blur + 'px';
}

['brightness','exposure','contrast','saturation','hue','warmth','blur'].forEach(key => {
  const el = $(`f_${key}`);
  if (!el) return;
  el.addEventListener('input', () => {
    if (!editSession) return;
    editSession.edits[key] = parseInt(el.value);
    updateEditValuesUI();
    applyPreviewFilter();
  });
});

filterPresets.addEventListener('click', e => {
  const btn = e.target.closest('.filter-preset');
  if (!btn || !editSession) return;
  const preset = FILTER_PRESETS[btn.dataset.preset];
  if (!preset) return;
  editSession.edits = { ...preset };
  $('f_brightness').value = preset.brightness;
  $('f_exposure').value = preset.exposure;
  $('f_contrast').value = preset.contrast;
  $('f_saturation').value = preset.saturation;
  $('f_hue').value = preset.hue;
  $('f_warmth').value = preset.warmth;
  $('f_blur').value = preset.blur;
  updateEditValuesUI();
  applyPreviewFilter();
});

editReset.addEventListener('click', () => {
  if (!editSession) return;
  const item = editSession.item;
  editSession.edits = { ...defaultEdits() };
  ['brightness','exposure','contrast','saturation','hue','warmth','blur'].forEach(k => {
    $(`f_${k}`).value = defaultEdits()[k];
  });
  updateEditValuesUI();
  applyPreviewFilter();
  
  if (editSession.cropState) {
    const faceBox = autoFocus.checked ? item.faceBoxAI : null;
    const def = computeDefaultCrop(item.transparentCanvas, faceBox, item.targetW, item.targetH);
    const s = editSession.cropState.scale;
    editSession.cropState.rect = {
      x: Math.max(0, def.left*s), y: Math.max(0, def.top*s),
      w: Math.min(editSession.cropState.stageW, def.w*s), h: Math.min(editSession.cropState.stageH, def.h*s),
    };
    editSession.cropState.rect.x = Math.max(0, Math.min(editSession.cropState.stageW - editSession.cropState.rect.w, editSession.cropState.rect.x));
    editSession.cropState.rect.y = Math.max(0, Math.min(editSession.cropState.stageH - editSession.cropState.rect.h, editSession.cropState.rect.y));
    updateCropRectEl();
    pushCropHistory();
  }
  showToast('Reset to defaults', 'info');
});

// ============ FIX #9: Safe async Apply ============
editApply.addEventListener('click', async () => {
  if (!editSession) return;
  const session = editSession;
  const item = session.item;
  const cs = session.cropState;
  const edits = cloneEdits(session.edits);
  
  const s = cs.scale;
  const r = cs.rect;
  
  item.cropLeft = r.x/s;
  item.cropTop = r.y/s;
  item.cropW = r.w/s;
  item.cropH = r.h/s;
  item.manualCrop = true;
  item.edits = edits;
  
  item.transparentFramed = cropToTarget(item.transparentCanvas,
    { left: item.cropLeft, top: item.cropTop, w: item.cropW, h: item.cropH },
    item.targetW, item.targetH);
  
  const previewBlob = await new Promise(res => item.transparentFramed.toBlob(res, 'image/png'));
  if (previewBlob) {
    if (item.transparentFramedUrl) URL.revokeObjectURL(item.transparentFramedUrl);
    item.transparentFramedUrl = URL.createObjectURL(previewBlob);
  }
  
  // Safe close — only closes if still open
  if (editSession === session) closeEditModal();
  
  const fmt = getOutputFormat();
  const bg = getCurrentBg();
  const { min: tMin, max: tMax } = getSizeTargets();
  const composed = applyEditsAndComposite(item.transparentFramed, bg, item.edits);
  const blob = await encodeToTarget(composed, tMin, tMax, fmt.mime);
  if (blob) item.sizeKB = blob.size / 1024;
  
  render();
  saveState();
  showToast('Changes applied', 'success');
});

langToggle.addEventListener('click', () => {
  currentLang = currentLang === 'en' ? 'bn' : 'en';
  langToggle.textContent = currentLang === 'en' ? 'বাং' : 'EN';
  showToast(currentLang === 'bn' ? 'ভাষা পরিবর্তন (সীমিত)' : 'Language switched (partial)', 'info');
});

// ============ GLOBAL SHORTCUTS ============
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey && editModal.classList.contains('hidden')) {
    e.preventDefault(); undoBtn.click();
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'z')) && editModal.classList.contains('hidden')) {
    e.preventDefault(); redoBtn.click();
  }
});

updateBgModeUI();
updateAiStatus();
updateButtons();

const startPreload = () => {
  if (currentPillState === 'ready' || currentPillState === 'loading') return;
  currentPillState = 'loading'; updateAiStatus();
  ensureAiLoaded()
    .then(() => { currentPillState = 'ready'; updateAiStatus(); modelBytesByKey.clear(); })
    .catch(() => { currentPillState = 'fail'; updateAiStatus(); });
};
if ('requestIdleCallback' in window) requestIdleCallback(startPreload, { timeout: 2000 });
else setTimeout(startPreload, 1200);
